<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ọrọ̀</title>
<meta name="apple-mobile-web-app-title" content="Ọrọ̀">
<meta name="theme-color" content="#0054F4">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<script>
  // Opens the private Ọrọ̀ app. It still needs Jide's Google sign-in; this page only gives it an icon.
  var APP = 'https://script.google.com/macros/s/AKfycbw0L5y17qk0ki5w1i1srr96OOVTBvqmk2yz5TFTb9K9sw2RpU-y3OULFgVyDcwtq9T3/exec';
  if (location.search.indexOf('launch') !== -1) location.replace(APP);
</script>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F7F8FC;color:#0F172A;font:400 16px/24px -apple-system,system-ui,sans-serif;padding:24px;box-sizing:border-box;text-align:center}
  @media (prefers-color-scheme:dark){body{background:#0B1020;color:#F1F4FA}.muted{color:#A8B3CC!important}}
  img{width:96px;height:96px;border-radius:22px}
  h1{font-size:26px;margin:18px 0 6px}
  .muted{color:#475569}
  ol{text-align:left;max-width:320px;margin:20px auto}
  a.btn{display:inline-block;margin-top:8px;background:#0054F4;color:#fff;text-decoration:none;font-weight:600;padding:12px 22px;border-radius:8px}
</style>
</head>
<body>
<main>
  <img src="apple-touch-icon.png" alt="">
  <h1>Ọrọ̀</h1>
  <p class="muted">Add Ọrọ̀ to your home screen</p>
  <ol>
    <li>Tap the <b>Share</b> button in Safari.</li>
    <li>Choose <b>Add to Home Screen</b>, then <b>Add</b>.</li>
    <li>Open Ọrọ̀ from your home screen.</li>
  </ol>
  <a class="btn" id="open" href="#">Open Ọrọ̀ now</a>
</main>
<script>
  history.replaceState(null, '', location.pathname + '?launch=1');
  document.getElementById('open').href = APP;
</script>
</body>
</html>
